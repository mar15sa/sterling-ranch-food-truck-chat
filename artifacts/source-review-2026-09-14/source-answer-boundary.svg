<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">How reviewed CAB content becomes answer evidence</title><desc id="desc">Review complete official content. Exclude unnecessary, outdated or conflicting claims; retain useful links separately. Approve exact claims and actions for an exact source version. Recheck canonical URL, full text, actions and required PDF bytes. Expired or changed evidence is withheld. Only current approved claims matching the requested subject and details reach answers; missing details remain explicit.</desc><style>text{font-family:Arial,sans-serif;fill:#244034;font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#708479;stroke-width:1.5}.line{stroke:#708479;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#708479"/></marker></defs><rect width="960" height="590" fill="#f4f2ec"/><text x="40" y="44" font-size="26">The source-to-answer boundary</text><text class="small" x="40" y="72">September 14 implementation · deployment status recorded in the guide</text><rect class="box" x="250" y="100" width="460" height="70" rx="8"/><text x="480" y="130" text-anchor="middle">Read complete official content</text><text class="small" x="480" y="155" text-anchor="middle">Check useful role, current version and authority</text><path class="line" d="M480 170 V220"/><rect class="box" x="250" y="220" width="460" height="75" rx="8"/><text x="480" y="249" text-anchor="middle">Approve only exact claims and actions</text><text class="small" x="480" y="275" text-anchor="middle">Keep links separate from evidence of facts</text><path class="line" d="M250 135 H115 V220"/><rect class="box" x="25" y="220" width="185" height="75" rx="8"/><text x="117" y="250" text-anchor="middle">Exclude</text><text class="small" x="117" y="277" text-anchor="middle">Old, duplicate, unhelpful</text><path class="line" d="M480 295 V345"/><rect class="box" x="250" y="345" width="460" height="85" rx="8"/><text x="480" y="375" text-anchor="middle">Recheck the approved version</text><text class="small" x="480" y="401" text-anchor="middle">URL + text + actions + required PDF byte identity</text><path class="line" d="M710 386 H790"/><rect class="box" x="790" y="345" width="145" height="85" rx="8"/><text x="862" y="374" text-anchor="middle">Withhold</text><text class="small" x="862" y="401" text-anchor="middle">Changed / expired</text><path class="line" d="M480 430 V480"/><rect class="box" x="250" y="480" width="460" height="70" rx="8"/><text x="480" y="509" text-anchor="middle">Select the requested subject and details</text><text class="small" x="480" y="534" text-anchor="middle">Keep full claims, conditions, system and date</text></svg>
