name: Rules assistant CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: rules-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run fast deterministic checks
        env:
          RULES_LLM_MODE: off
          RULES_ENABLE_LLM_REWRITE: "false"
        run: npm run test:fast

  quality:
    if: github.event_name == 'pull_request'
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Revalidate due approved evidence into a temporary snapshot
        uses: ./.github/actions/revalidate-approved-community-evidence
      - name: Run the comprehensive quality gate against temporary evidence
        env:
          RULES_LLM_MODE: off
          RULES_ENABLE_LLM_REWRITE: "false"
        run: |
          npm run check
      - name: Preserve evidence revalidation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-evidence-revalidation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  deployment-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    concurrency:
      group: ${{ github.ref_name == 'main' && 'production-critical-capability-monitor' || 'staging-critical-capability-monitor' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Select deployed environment
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "DEPLOYMENT_BASE_URL=${{ vars.PRODUCTION_BASE_URL || 'https://sterlingranchsociety.com' }}" >> "$GITHUB_ENV"
          else
            echo "DEPLOYMENT_BASE_URL=${{ vars.STAGING_BASE_URL || 'https://sterling-ranch-food-truck-chat-staging.up.railway.app' }}" >> "$GITHUB_ENV"
          fi
      - name: Wait for and verify the exact deployment
        env:
          EXPECTED_DEPLOYMENT_REVISION: ${{ github.sha }}
        run: npm run check:deployment
      - name: Verify required answer capabilities through the deployed path
        if: steps.release-scope.outputs.scope == 'full'
        env:
          EXPECTED_DEPLOYMENT_REVISION: ${{ github.sha }}
        run: node scripts/check-community-capabilities.js
      - name: Record a production capability failure or recovery
        if: always() && github.ref_name == 'main' && steps.release-scope.outputs.scope == 'full'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { publishIncident } = require('./scripts/community-capability-alert');
            let report;
            try { report = JSON.parse(fs.readFileSync('artifacts/critical-capabilities.json', 'utf8')); }
            catch { report = { result: 'failed', issues: ['release-capability-check-did-not-complete'] }; }
            core.info(JSON.stringify(await publishIncident({ github, context, report })));
      - name: Preserve capability verification
        if: always() && steps.release-scope.outputs.scope == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: critical-capabilities
          path: artifacts/critical-capabilities.json
          if-no-files-found: warn
          retention-days: 30
