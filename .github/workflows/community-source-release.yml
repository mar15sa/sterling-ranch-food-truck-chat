name: Sterling Ranch source inventory and review

on:
  workflow_dispatch:
    inputs:
      monthly:
        description: Also record the monthly review
        type: boolean
        default: false
  schedule:
    - cron: "35 8 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: community-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Collect source inventory
        id: inventory
        run: |
          force=""
          if [ "$(date -u +%u)" = "7" ]; then force="--force-content"; fi
          npm run ingest:community -- --max-pages 500 --max-documents 250 --output data/community-index.candidate.json $force
      - name: Sync review evidence
        if: always() && steps.inventory.outcome == 'success'
        env:
          COMMUNITY_SOURCE_REVIEW_NOTION_TOKEN: ${{ secrets.COMMUNITY_SOURCE_REVIEW_NOTION_TOKEN }}
          COMMUNITY_SOURCE_REVIEW_NOTION_DATABASE_ID: ${{ secrets.COMMUNITY_SOURCE_REVIEW_NOTION_DATABASE_ID }}
          COMMUNITY_SOURCE_REVIEW_NOTION_DATA_SOURCE_ID: ${{ secrets.COMMUNITY_SOURCE_REVIEW_NOTION_DATA_SOURCE_ID }}
        run: node scripts/sync-community-review.js --candidate data/community-index.candidate.json
      - name: Export decisions and check overdue reviews
        if: always()
        env:
          COMMUNITY_SOURCE_REVIEW_NOTION_TOKEN: ${{ secrets.COMMUNITY_SOURCE_REVIEW_NOTION_TOKEN }}
          COMMUNITY_SOURCE_REVIEW_NOTION_DATABASE_ID: ${{ secrets.COMMUNITY_SOURCE_REVIEW_NOTION_DATABASE_ID }}
          COMMUNITY_SOURCE_REVIEW_NOTION_DATA_SOURCE_ID: ${{ secrets.COMMUNITY_SOURCE_REVIEW_NOTION_DATA_SOURCE_ID }}
        run: node scripts/export-community-review-decisions.js --output data/community-review-decisions.json --fail-overdue
      - name: Validate candidate sources and action links
        if: always() && steps.inventory.outcome == 'success'
        run: npm run community:candidate -- --candidate data/community-index.candidate.json --decisions data/community-review-decisions.json --report data/community-source-report.json --check-links
      - name: Record monthly accuracy and review outcomes
        if: always()
        env:
          RUN_MONTHLY: ${{ inputs.monthly }}
          COMMUNITY_SOURCE_REVIEW_NOTION_TOKEN: ${{ secrets.COMMUNITY_SOURCE_REVIEW_NOTION_TOKEN }}
          COMMUNITY_SOURCE_REVIEW_NOTION_DATABASE_ID: ${{ secrets.COMMUNITY_SOURCE_REVIEW_NOTION_DATABASE_ID }}
          COMMUNITY_SOURCE_REVIEW_NOTION_DATA_SOURCE_ID: ${{ secrets.COMMUNITY_SOURCE_REVIEW_NOTION_DATA_SOURCE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "$RUN_MONTHLY" = "true" ]; then
            node scripts/report-community-monthly.js
          fi
      - name: Preserve monitoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-monitor-${{ github.run_id }}
          path: |
            data/community-index.candidate.json
            data/community-source-report.json
            data/community-review-summary.json
            data/community-monthly-report.json
          retention-days: 30
      - name: Open or update an exception issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Sterling Ranch source monitor needs review";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The trusted source bundle remains live because an automated accuracy or deployment gate failed. Review: ${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100 });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (!existing) await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
      - name: Close the exception issue after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Sterling Ranch source monitor needs review";
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100 });
            for (const issue of issues.filter((item) => !item.pull_request && item.title === title)) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: "The source inventory and review checks are passing again. Closing this alert." });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: "closed" });
            }
