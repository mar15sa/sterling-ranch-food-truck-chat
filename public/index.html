      name="description"
      content="Check today's Sterling Ranch food truck, menu items, and official truck links."

    <meta property="og:site_name" content="Sterling Ranch Food Truck Chat" />

      property="og:description"
      content="Check today's Sterling Ranch food truck, menu items, and official truck links."
    />
    <meta property="og:url" content="https://sterlingranchsociety.com/" />
    <meta property="og:image" content="https://sterlingranchsociety.com/social-preview-v2.png" />
    <meta property="og:image:secure_url" content="https://sterlingranchsociety.com/social-preview-v2.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sterling Ranch Food Truck Chat" />
    <meta
      name="twitter:description"
      content="Check today's Sterling Ranch food truck, menu items, and official truck links."
    />
    <meta name="twitter:image" content="https://sterlingranchsociety.com/social-preview-v2.png" />
    <meta name="twitter:image:alt" content="Sterling Ranch Food Truck Chat preview" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=20260607-mobile-composer-v2" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GSHC10SK92"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-GSHC10SK92");
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-panel" aria-label="Food truck chat">
        <header class="topbar">
          <div>
            <p class="eyebrow">Sterling Ranch</p>
            <h1>Food Truck Chat</h1>
          </div>
          <div class="status-pill" id="statusPill">Ready</div>
        </header>

        <div class="messages" id="messages" aria-live="polite"></div>

        <div class="quick-actions" id="quickActions" aria-label="Quick questions"></div>

        <form class="composer" id="chatForm">
          <input
            id="questionInput"
            name="question"
            autocomplete="off"
            placeholder="Ask about today, tomorrow, May 20..."
          />
          <button type="submit" aria-label="Send question">→</button>
        </form>

        <footer class="app-footer">
          <nav class="feedback-links" aria-label="Feedback">
            <a
              href="https://github.com/mar15sa/sterling-ranch-food-truck-chat/issues/new?labels=bug&amp;title=Bug%3A%20&amp;body=What%20happened%3F%0A%0AWhat%20did%20you%20expect%20to%20happen%3F%0A%0AWhat%20date%20or%20food%20truck%20were%20you%20checking%3F"
              target="_blank"
              rel="noreferrer"
              data-feedback-type="bug"
            >Report a bug</a>
            <a
              href="https://github.com/mar15sa/sterling-ranch-food-truck-chat/issues/new?labels=enhancement&amp;title=Feature%20request%3A%20&amp;body=What%20would%20you%20like%20the%20app%20to%20do%3F%0A%0AHow%20would%20this%20help%20you%3F"
              target="_blank"
              rel="noreferrer"
              data-feedback-type="feature"
            >Request a feature</a>
          </nav>
          <a
            class="maker-link"
            href="https://ideakitchen.ai/"
            target="_blank"
            rel="noreferrer"
          >Made by Idea Kitchen</a>
        </footer>
      </section>
    </main>

    <template id="botResultTemplate">
      <article class="message bot">
        <p class="answer-text"></p>
        <div class="truck-card hidden">
          <div>
            <span class="label">Truck</span>
            <strong class="truck-name"></strong>
          </div>
          <div>
            <span class="label">Date</span>
            <strong class="truck-date"></strong>
          </div>
          <div class="featured-links-section hidden">
            <span class="label">Links</span>
            <ul class="featured-links"></ul>
          </div>
        </div>
        <div class="menu-section hidden">
          <h2>Menu items found</h2>
          <ul class="menu-items"></ul>
        </div>
        <div class="menu-fallback hidden">
          <h2>Menu not readable yet</h2>
          <p>
            I found the truck, but could not pull menu items automatically this time.
            The official and helpful links are the best backup.
          </p>
        </div>
        <details class="truck-more-section hidden">
          <summary>More about this truck</summary>
          <div class="truck-more-content">
            <div class="links-section hidden">
              <h2>Other helpful links</h2>
              <ul class="menu-links"></ul>
            </div>
          </div>
        </details>
        <div class="result-meta">
          <span class="checked-at"></span>
          <a class="source-link" target="_blank" rel="noreferrer">Calendar source</a>
        </div>
      </article>
    </template>

    <script src="/app.js?v=20260607-feedback-refine"></script>
  </body>
</html>
