name: Rules assistant CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: rules-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run fast deterministic checks
        env:
          RULES_LLM_MODE: off
          RULES_ENABLE_LLM_REWRITE: "false"
        run: npm run test:fast

  quality:
    if: github.event_name == 'pull_request'
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Classify the release scope
        id: release-scope
        run: >-
          node scripts/check-openings-release-scope.js
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Revalidate due approved evidence into a temporary snapshot
        if: steps.release-scope.outputs.openings_only != 'true'
        uses: ./.github/actions/revalidate-approved-community-evidence
      - name: Run the comprehensive quality gate against temporary evidence
        if: steps.release-scope.outputs.openings_only != 'true'
        env:
          RULES_LLM_MODE: off
          RULES_ENABLE_LLM_REWRITE: "false"
        run: |
          npm run check
      - name: Run the isolated openings release gate
        if: steps.release-scope.outputs.openings_only == 'true'
        run: npm run openings:release:check
      - name: Preserve evidence revalidation records
        if: always() && steps.release-scope.outputs.openings_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: approved-evidence-revalidation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  deployment-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Classify the deployed release scope
        id: release-scope
        run: >-
          node scripts/check-openings-release-scope.js
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"
      - name: Select deployed environment
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "DEPLOYMENT_BASE_URL=${{ vars.PRODUCTION_BASE_URL || 'https://sterlingranchsociety.com' }}" >> "$GITHUB_ENV"
          else
            echo "DEPLOYMENT_BASE_URL=${{ vars.STAGING_BASE_URL || 'https://sterling-ranch-food-truck-chat-staging.up.railway.app' }}" >> "$GITHUB_ENV"
          fi
      - name: Wait for and verify the exact deployment
        env:
          EXPECTED_DEPLOYMENT_REVISION: ${{ github.sha }}
          OPENINGS_ONLY_DEPLOYMENT: ${{ steps.release-scope.outputs.openings_only }}
        run: npm run check:deployment
