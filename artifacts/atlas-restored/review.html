<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas review</title>
<style>body{margin:0;background:#f4efe4;color:#21332d;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px}h1{margin:0}#status{margin:20px 0;padding:18px;border-radius:12px;background:#fff}.fail{border-left:6px solid #b84a36}.pass{border-left:6px solid #42785b}code{white-space:pre-wrap}.state{background:#fff;border-radius:12px;margin:16px 0;padding:16px}.images{display:grid;grid-template-columns:1fr 1fr;gap:12px}.images img{width:100%;max-height:380px;object-fit:contain;background:#ddd}small{color:#53635d}</style>
<main><h1>Atlas visual review</h1><p>This page shows the local evidence gate. It does not approve or launch anything.</p><section id="status">Checking review status…</section><section id="evidence"></section></main>
<script type="module">const $=s=>document.querySelector(s);const clean=p=>typeof p==='string'&&!p.includes('..')?'/'+p.replace(/^\//,''):null;async function run(){const s=await fetch('/review-status.json').then(r=>r.json());$('#status').className=s.ok?'pass':'fail';$('#status').innerHTML=`<strong>${s.verdict}</strong><p>${s.message}</p>${s.issues?.length?`<details open><summary>Gate details</summary><ul>${s.issues.map(x=>`<li>${x}</li>`).join('')}</ul></details>`:''}`;try{const r=await fetch('/eval/visual-review.json');if(!r.ok)return;const v=await r.json();$('#evidence').innerHTML='<h2>Recorded comparison evidence</h2>'+v.states.map(x=>{const a=clean(x.baseline?.path),b=clean(x.candidate?.path);return `<article class="state"><h3>${x.name}</h3><div class="images">${a?`<figure><img src="${a}" alt="Recorded baseline for ${x.name}"><figcaption>Baseline</figcaption></figure>`:''}${b?`<figure><img src="${b}" alt="Recorded candidate for ${x.name}"><figcaption>Candidate</figcaption></figure>`:''}</div><small>Shown only when the review record exists.</small></article>`}).join('')}catch{}}run().catch(e=>$('#status').textContent='Could not read local review status: '+e.message)</script>
