name: Sterling Ranch source release

on:
  workflow_dispatch:
  schedule:
    - cron: "35 13 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sterling-ranch-source-release
  cancel-in-progress: false

jobs:
  refresh-and-promote:
    if: vars.COMMUNITY_AUTO_PROMOTE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and validate candidate
        env:
          COMMUNITY_SOURCE_REVIEW_NOTION_TOKEN: ${{ secrets.COMMUNITY_SOURCE_REVIEW_NOTION_TOKEN }}
          COMMUNITY_SOURCE_REVIEW_NOTION_DATABASE_ID: ${{ secrets.COMMUNITY_SOURCE_REVIEW_NOTION_DATABASE_ID }}
          COMMUNITY_SOURCE_REVIEW_NOTION_DATA_SOURCE_ID: ${{ secrets.COMMUNITY_SOURCE_REVIEW_NOTION_DATA_SOURCE_ID }}
        run: |
          force=""
          if [ "$(date -u +%u)" = "7" ]; then force="--force-content"; fi
          npm run ingest:community -- --max-pages 500 --max-documents 250 --output data/community-index.candidate.json $force
          npm run community:facts -- --input data/community-index.candidate.json --output data/community-index.candidate.json
          npm run community:review:export -- --output data/community-review-decisions.json --fail-overdue
          npm run community:candidate -- --candidate data/community-index.candidate.json --decisions data/community-review-decisions.json --report data/community-source-report.json --check-links --promote
          rm data/community-index.candidate.json
          rm data/community-review-decisions.json
          npm run community:safety
          npm run check
      - name: Publish source-only staging commit
        id: staging_commit
        run: |
          if git diff --quiet -- data/community-index.json data/community-source-report.json data/community-assistant-eval.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community-index.json data/community-source-report.json data/community-assistant-eval.json
          git commit -m "Refresh verified Sterling Ranch sources"
          git push origin HEAD:staging
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(node -e \"console.log(require('./lib/community-release').fingerprint(require('./data/community-index.json')))\")" >> "$GITHUB_OUTPUT"
      - name: One-hour staging soak
        if: steps.staging_commit.outputs.changed == 'true'
        env:
          RULES_LIVE_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://sterling-ranch-food-truck-chat-staging.up.railway.app' }}
          EXPECTED_COMMUNITY_FINGERPRINT: ${{ steps.staging_commit.outputs.fingerprint }}
        run: npm run community:soak -- --checks 5 --interval-ms 900000
      - name: Run complete live staging monitor
        if: steps.staging_commit.outputs.changed == 'true'
        env:
          RULES_LIVE_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://sterling-ranch-food-truck-chat-staging.up.railway.app' }}
        run: npm run rules:monitor:live
      - name: Promote the exact source bundle to production
        if: steps.staging_commit.outputs.changed == 'true'
        id: production_commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_commit="${{ steps.staging_commit.outputs.commit }}"
          git fetch origin main
          base_sha="$(git rev-parse origin/main)"
          git checkout -B source-release-main origin/main
          git checkout "$source_commit" -- data/community-index.json data/community-source-report.json data/community-assistant-eval.json
          git add data/community-index.json data/community-source-report.json data/community-assistant-eval.json
          git commit -m "Refresh verified Sterling Ranch sources"
          branch="source-release/${{ github.run_id }}"
          git push origin "HEAD:$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "Refresh verified Sterling Ranch sources" --body "Promotes the exact source bundle that passed the complete inventory, source review, staging tests, and soak gates.")"
          gh pr merge "$pr_url" --auto --merge
          for attempt in $(seq 1 40); do
            state="$(gh pr view "$pr_url" --json state --jq .state)"
            if [ "$state" = "MERGED" ]; then break; fi
            sleep 30
          done
          if [ "$(gh pr view "$pr_url" --json state --jq .state)" != "MERGED" ]; then echo "Protected production merge did not complete."; exit 1; fi
          merge_sha="$(gh pr view "$pr_url" --json mergeCommit --jq .mergeCommit.oid)"
          echo "commit=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Verify production and roll back on failure
        if: steps.staging_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RULES_LIVE_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://sterlingranchsociety.com' }}
          EXPECTED_COMMUNITY_FINGERPRINT: ${{ steps.staging_commit.outputs.fingerprint }}
        run: |
          set +e
          npm run community:soak -- --checks 2 --interval-ms 60000
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            git fetch origin main
            git checkout -B "source-rollback-${{ github.run_id }}" origin/main
            git checkout "${{ steps.production_commit.outputs.base_sha }}" -- data/community-index.json data/community-source-report.json data/community-assistant-eval.json
            git add data/community-index.json data/community-source-report.json data/community-assistant-eval.json
            git commit -m "Roll back failed Sterling Ranch source release"
            rollback_branch="source-rollback/${{ github.run_id }}"
            git push origin "HEAD:$rollback_branch"
            rollback_pr="$(gh pr create --base main --head "$rollback_branch" --title "Roll back failed Sterling Ranch source release" --body "Production verification failed, so this restores the last trusted source fingerprint.")"
            gh pr merge "$rollback_pr" --auto --merge
            exit "$result"
          fi
      - name: Open or update an exception issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Sterling Ranch automatic source release was blocked";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The trusted source bundle remains live because an automated accuracy or deployment gate failed. Review: ${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100 });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
      - name: Close the exception issue after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Sterling Ranch automatic source release was blocked";
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100 });
            for (const issue of issues.filter((item) => !item.pull_request && item.title === title)) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: "The automatic source release is passing again. Closing this alert." });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: "closed" });
            }
