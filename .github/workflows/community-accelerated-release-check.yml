name: Community Assistant accelerated release check

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      revision:
        required: true
        type: string
      fingerprint:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Hosted environment to check without publishing
        required: true
        type: choice
        options:
          - staging
          - production
      revision:
        description: Exact deployed application commit
        required: true
        type: string
      fingerprint:
        description: Expected approved community source fingerprint
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: community-staging-publisher
  cancel-in-progress: false

jobs:
  accelerated-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate immutable target
        env:
          EXPECTED_APPLICATION_REVISION: ${{ inputs.revision }}
          EXPECTED_COMMUNITY_FINGERPRINT: ${{ inputs.fingerprint }}
        run: |
          node -e 'for (const k of ["EXPECTED_APPLICATION_REVISION", "EXPECTED_COMMUNITY_FINGERPRINT"]) if (!/^[a-f0-9]{40,64}$/.test(process.env[k] || "")) process.exit(1)'
          test "$(git rev-parse HEAD)" = "$EXPECTED_APPLICATION_REVISION"
      - name: Run one-hour hosted application gate
        env:
          EXPECTED_APPLICATION_REVISION: ${{ inputs.revision }}
          EXPECTED_COMMUNITY_FINGERPRINT: ${{ inputs.fingerprint }}
          RULES_LIVE_BASE_URL: ${{ inputs.environment == 'staging' && (vars.STAGING_BASE_URL || 'https://sterling-ranch-food-truck-chat-staging.up.railway.app') || (vars.PRODUCTION_BASE_URL || 'https://sterlingranchsociety.com') }}
        run: |
          mkdir -p trial-evidence
          node scripts/check-community-application-soak.js --duration-hours 1 --checks 5 --interval-ms 900000 --routing-benchmark --report trial-evidence/report.json --write 2>&1 | tee trial-evidence/accelerated-gate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-accelerated-release-check-${{ inputs.environment }}-${{ github.run_id }}
          path: trial-evidence/
          retention-days: 30
