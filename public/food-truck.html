  <body>
    <main class="app-shell">
      <section class="chat-panel" aria-label="Food truck chat">
        <header class="topbar">
          <div>
            <p class="eyebrow">Sterling Ranch</p>
            <h1>Food Truck Chat</h1>
          </div>
          <div class="status-pill" id="statusPill">Ready</div>
        </header>

        <div class="messages" id="messages" aria-live="polite"></div>

        <div class="quick-actions" id="quickActions" aria-label="Quick questions"></div>

        <form class="composer" id="chatForm">
          <input
            id="questionInput"
            name="question"
            autocomplete="off"
            placeholder="Ask about today, tomorrow, May 20..."
          />
          <button type="submit" aria-label="Send question">→</button>
        </form>

        <footer class="app-footer">
          <details class="settings-menu" id="settingsMenu">
            <summary aria-label="Settings">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"
                />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </summary>
            <nav class="feedback-links" aria-label="Feedback">
              <a
                href="mailto:hello@ideakitchen.ai?subject=Food%20Truck%20Chat%20bug%20report&amp;body=What%20happened%3F%0A%0AWhat%20did%20you%20expect%20to%20happen%3F%0A%0AWhat%20date%20or%20food%20truck%20were%20you%20checking%3F%0A%0AWhat%20device%20and%20browser%20were%20you%20using%3F%0A%0APlease%20attach%20a%20screenshot%20if%20you%20can."
                data-feedback-type="bug"
              >Report a bug</a>
              <a
                href="mailto:hello@ideakitchen.ai?subject=Food%20Truck%20Chat%20feature%20request&amp;body=What%20would%20you%20like%20the%20app%20to%20do%3F%0A%0AHow%20would%20this%20help%20you%3F"
                data-feedback-type="feature"
              >Request a feature</a>
            </nav>
          </details>
          <a
            class="maker-link"
            href="https://ideakitchen.ai/"
            target="_blank"
            rel="noreferrer"
          >
            <img src="/idea-kitchen-icon.svg?v=transparent" alt="" />
            <span>Made by Idea Kitchen</span>
          </a>
        </footer>
      </section>
    </main>

    <template id="botResultTemplate">
      <article class="message bot">
        <p class="answer-text"></p>
        <div class="truck-card hidden">
          <div>
            <span class="label">Truck</span>
            <strong class="truck-name"></strong>
          </div>
          <div>
            <span class="label">Date</span>
            <strong class="truck-date"></strong>
          </div>
          <div class="featured-links-section hidden">
            <span class="label">Links</span>
            <ul class="featured-links"></ul>
          </div>
        </div>
        <div class="menu-section hidden">
          <h2>Menu items found</h2>
          <ul class="menu-items"></ul>
        </div>
        <div class="menu-fallback hidden">
          <h2>Menu not readable yet</h2>
          <p>
            I found the truck, but could not pull menu items automatically this time.
            The official and helpful links are the best backup.
          </p>
        </div>
        <details class="truck-more-section hidden">
          <summary>More about this truck</summary>
          <div class="truck-more-content">
            <div class="links-section hidden">
              <h2>Other helpful links</h2>
              <ul class="menu-links"></ul>
            </div>
          </div>
        </details>
        <div class="result-meta">
          <span class="checked-at"></span>
          <a class="source-link" target="_blank" rel="noreferrer">Calendar source</a>
        </div>
      </article>
    </template>

    <script src="/app.js?v=20260607-footer-icons"></script>
  </body>
