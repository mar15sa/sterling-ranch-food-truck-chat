name: Rules supplement monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan official CAB documents for new rule supplements
        run: npm run supplements:monitor
