name: Rules answer quality monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "15 15 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: rules-answer-quality-monitor
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check local rules retrieval and uncertainty handling
        run: npm run check

      - name: Check the live rules assistant
        run: npm run rules:monitor:live

      - name: Open or update the review issue when checks fail
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Rules assistant quality monitor needs review";
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled rules-assistant quality check failed.",
              "",
              `Review the failed run: ${workflowUrl}`,
              "",
              "Please inspect any recent Railway log entries beginning with `uncertain answer recorded`. For each real gap, verify the official rule, fix retrieval or answer wording, and add the resident's phrasing to `scripts/rules-eval-cases.json` before closing this issue.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close the review issue after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Rules assistant quality monitor needs review";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues.filter((item) => !item.pull_request && item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "The scheduled local and live rules checks are passing again. Closing this monitoring issue automatically.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }