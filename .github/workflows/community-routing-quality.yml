name: AI routing checks

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Small routine check, or explicit full AI-behavior benchmark
        type: choice
        options:
          - smoke
          - full
        default: smoke
      trial:
        description: Run the hosted 24-hour staging trial instead of the routing-only check
        type: boolean
        default: false
      accelerated:
        description: Run the one-hour hosted staging or production gate
        type: boolean
        default: false
      environment:
        description: Hosted environment for the accelerated gate
        type: choice
        options:
          - staging
          - production
        default: staging
      revision:
        description: Exact staging revision (required for trial)
        type: string
      fingerprint:
        description: Approved source fingerprint (required for trial)
        type: string
  schedule:
    - cron: "23 14 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: community-routing-quality
  cancel-in-progress: false

jobs:
  live-routing:
    if: ${{ !inputs.trial && !inputs.accelerated }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || 'staging' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restore prior full routing evidence
        uses: actions/cache@v4
        with:
          path: .cache/community-routing
          key: community-routing-evidence-v1-${{ github.run_id }}
          restore-keys: community-routing-evidence-v1-
      - name: Run small routing check or reuse compatible full evidence
        env:
          COMMUNITY_ROUTING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://sterling-ranch-food-truck-chat-staging.up.railway.app' }}
          ROUTING_PROFILE: ${{ inputs.profile || 'smoke' }}
          COMMUNITY_ROUTING_DELAY_MS: 2100
        run: node scripts/check-community-routing-release.js --profile="$ROUTING_PROFILE"
      - name: Preserve routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-evidence-${{ github.run_id }}
          path: data/community-routing-live-report.json
          retention-days: 30
  hosted-trial:
    if: ${{ inputs.trial && !inputs.accelerated }}
    uses: ./.github/workflows/community-hosted-trial.yml
    with:
      revision: ${{ inputs.revision }}
      fingerprint: ${{ inputs.fingerprint }}
  accelerated-gate:
    if: ${{ inputs.accelerated && !inputs.trial }}
    uses: ./.github/workflows/community-accelerated-release-check.yml
    with:
      environment: ${{ inputs.environment }}
      revision: ${{ inputs.revision }}
      fingerprint: ${{ inputs.fingerprint }}
