<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas mobile frame</title>
<style>body{margin:0;background:#e9e4d8;color:#23332e;font:15px system-ui,sans-serif}main{padding:18px;max-width:1100px;margin:auto}form{display:flex;gap:8px;flex-wrap:wrap}input{padding:9px;font:inherit;min-width:280px}input[type=number]{min-width:70px;width:70px}button{padding:9px 14px}.device{margin:20px auto;width:fit-content;padding:12px;background:#262b29;border-radius:28px;box-shadow:0 8px 30px #0004}iframe{display:block;border:0;background:#fff;border-radius:18px}small{display:block;margin-top:10px}body.clean{background:#fff;width:var(--frame-width);overflow:hidden}body.clean main{padding:0;margin:0;width:var(--frame-width)}body.clean form,body.clean h1,body.clean small,body.clean .device{display:none}body.clean iframe{border-radius:0}</style>
<main><h1>Mobile review frame</h1><form><label>Target URL <input id="url" value="/" aria-label="Target URL"></label><label>Width <input id="width" type="number" value="390" min="240" max="1200"></label><label>Height <input id="height" type="number" value="844" min="300" max="1600"></label><button>Load</button></form><div class="device"><iframe id="frame" title="Atlas mobile review" width="390" height="844"></iframe></div><small>Only local paths, this loopback server, or loopback ports 4184 and 4186 may be framed.</small></main>
<script>const q=new URLSearchParams(location.search),f=document.querySelector('form'),u=document.querySelector('#url'),w=document.querySelector('#width'),h=document.querySelector('#height'),frame=document.querySelector('#frame');const range=(v,min,max,fallback)=>{const n=Number(v);return Number.isInteger(n)&&n>=min&&n<=max?n:fallback};const clean=q.get('clean')==='1';const target=q.get('target')||'/';w.value=range(q.get('width'),240,1200,390);h.value=range(q.get('height'),300,1600,844);u.value=target;function allowed(value){try{const x=new URL(value,location.href);return x.origin===location.origin||(['127.0.0.1','localhost'].includes(x.hostname)&&['4184','4186'].includes(x.port))?x.href:null}catch{return null}}function load(){const width=range(w.value,240,1200,390),height=range(h.value,300,1600,844),next=allowed(u.value);w.value=width;h.value=height;if(!next){if(!clean)alert('Use a local path or an allowed loopback URL.');return}frame.src=next;frame.width=width;frame.height=height;if(clean){document.body.classList.add('clean');document.body.style.setProperty('--frame-width',width+'px');document.body.append(frame)}}f.addEventListener('submit',e=>{e.preventDefault();load()});load()</script>
