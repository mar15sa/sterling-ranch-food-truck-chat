name: Rules answer quality monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "15 15 * * *"
    - cron: "7 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: rules-answer-quality-monitor
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify live facility and calendar connectors
        run: node scripts/check-community-live-monitor.js

      - name: Check local rules retrieval and uncertainty handling
        if: github.event.schedule != '7 * * * *'
        run: npm run check

      - name: Re-audit every captured resident wording
        if: github.event.schedule != '7 * * * *'
        run: npm run rules:eval:residents

      - name: Verify official resident-resource links
        if: github.event.schedule != '7 * * * *'
        run: npm run rules:resources:check:live

      - name: Refresh and audit official community sources
        if: github.event.schedule != '7 * * * *'
        run: npm run community:check -- --live

      - name: Check the live rules assistant
        if: github.event.schedule != '7 * * * *'
        run: npm run rules:monitor:live

      - name: Check live food-truck lookups
        if: github.event.schedule != '7 * * * *'
        env:
          FAIL_ON_UNREACHABLE_SITE: "true"
        run: npm run check:live

      - name: Preserve completed monitoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-monitor-${{ github.run_id }}
          path: |
            data/community-live-monitor-report.json
            data/community-assistant-eval.json
            data/community-retrieval-report.json
          retention-days: 35

      - name: Open or update the review issue when checks fail
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.schedule === "7 * * * *" ? "Live community connector monitor needs review" : "Resident tools quality monitor needs review";
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled resident-tools quality check failed.",
              "",
              `Review the failed run: ${workflowUrl}`,
              "",
              "Review source changes, broken links, stale answers, and any Railway entries beginning with `uncertain answer recorded`. Fix the reusable retrieval, grounding, or source-coverage cause and add representative wording to the evaluation set before closing this issue.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close the review issue after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.schedule === "7 * * * *" ? "Live community connector monitor needs review" : "Resident tools quality monitor needs review";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues.filter((item) => !item.pull_request && item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "The scheduled local and live rules checks are passing again. Closing this monitoring issue automatically.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
